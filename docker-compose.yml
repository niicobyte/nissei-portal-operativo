version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nissei-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-nissei_local_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nissei_portal}
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - nissei_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 15

volumes:
  nissei_mysql_data:
